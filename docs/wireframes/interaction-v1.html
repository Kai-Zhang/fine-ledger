function txRows(rows){if(!rows.length)return '<div class="fl-empty">没有符合条件的记录</div>';let last='';return rows.sort((a,b)=>b.time.localeCompare(a.time)).map(t=>{const day=t.time.slice(0,10),a=acct(t.account),left=day!==last?`<div class="fl-day">${day.replaceAll('-',' / ')}</div>`:'';last=day;return left+`<div class="fl-row">${ico(t.type==='transfer'?'arrow-left-right':catIcon(t.category))}<button type="button" class="fl-grow fl-account" data-action="detail" data-id="${t.id}"><span class="fl-stack"><span>${esc(t.desc)}</span><span class="fl-small">${t.time.slice(11,16)} · ${state.screen==='all'||state.screen==='report-transactions'?esc(a.name):esc(catName(t.category)||'转账')}</span></span><span class="fl-num">${t.type==='transfer'?(state.screen==='ledger'&&state.account===t.to?'+'+amount(t.received,acct(t.to).currency):'−'+amount(t.amount,a.currency)):signed(t)}<span class="fl-small"> ${t.type==='transfer'&&state.screen==='ledger'&&state.account===t.to?acct(t.to).currency:a.currency}</span></span></button></div>`;}).join('');}

function archived(){return header('已归档账户')+`<main class="fl-main">${accountRows(accounts.filter(a=>a.archived),true)}</main>`+nav();}
function makeForm(id=null,kind=null,original=null){const t=id?txs.find(t=>t.id===id):null;let a=t?acct(t.account):acct(state.account);if(a.archived&&!t){a=accounts.find(x=>!x.archived&&x.currency===a.currency)||accounts[0];}const f={id:t?.id||null,kind:kind||(t?.type||'expense'),account:a.id,to:t?.to||'jpy',amount:t?String(t.amount/(a.currency==='JPY'?1:100)):'',received:t?.received?String(t.received/(acct(t.to).currency==='JPY'?1:100)):'',desc:t?.desc||'',category:t?.category||'',manualCat:false,time:t?.time||'2026-10-28T09:41:27',posted:t?.posted??true,note:t?.note||'',project:t?.project||'',extra:!!(t?.note||t?.project),postingDate:t?.postingDate||'2026-10-28',original:original||t?.original||null,confirm:kind==='confirm'};if(f.confirm)f.kind='expense';if(kind==='refund'){const src=txs.find(x=>x.id===original);f.desc='退款 · '+src.desc;f.category=src.category;f.project=src.project||'';f.amount=String((src.amount-txs.filter(x=>x.original===src.id&&!x.deleted).reduce((v,x)=>v+x.amount,0))/(acct(src.account).currency==='JPY'?1:100));}go('form',{form:f,keyboard:kind==='confirm'?null:'amount'});state.formInitial=JSON.stringify(f);}
function formView(){const f=state.form,a=acct(f.account),transfer=f.kind==='transfer',fixed=f.kind==='refund'||f.confirm,title=f.confirm?'确认入账':f.id?'编辑记录':f.kind==='refund'?'退款':'记一笔';return header(title,button('取消','back'))+`<main class="fl-main">${fixed?'':`<div class="fl-tabs" role="tablist" aria-label="交易类型">${[['expense','支出'],['income','收入'],['transfer','转账']].map(([k,l])=>button(l,'form-kind',`role="tab" aria-selected="${f.kind===k}" data-kind="${k}"`)).join('')}</div>`}<div class="fl-field"><span class="fl-label">${transfer?'转出':'账户'}</span>${button(esc(a.name)+' <span class="fl-small">'+a.currency+' ›</span>','pick-account','data-slot="account"')}</div><div class="fl-amount"><span>${a.currency}</span><input id="fl-amount" inputmode="decimal" aria-label="${transfer?'转出金额':'金额'}" placeholder="0.00" value="${esc(f.amount)}"></div>${transfer?`<div class="fl-field"><span class="fl-label">转入</span>${button(esc(acct(f.to).name)+' <span class="fl-small">'+acct(f.to).currency+' ›</span>','pick-account','data-slot="to"')}</div><div class="fl-field"><label for="fl-received">到账</label><input id="fl-received" inputmode="decimal" placeholder="填写实际到账金额" value="${esc(f.received)}"><span class="fl-small">${acct(f.to).currency}</span></div><div id="fl-rate" class="fl-small" style="padding:5px 16px">${transferRate(f)}</div>`:''}<div class="fl-field"><label for="fl-desc">描述</label><input id="fl-desc" placeholder="必填，可选历史描述" value="${esc(f.desc)}" autocomplete="off"></div>${transfer?'':`<div class="fl-field"><span class="fl-label">类目</span>${button((f.category?ico(catIcon(f.category))+esc(catName(f.category)):'选择类目（必填）')+'<span>›</span>','pick-category')}</div>`}<div class="fl-field"><span class="fl-label">时间</span>${button(prefixDate(f.time)+'<span>›</span>','pick-time')}</div><div class="fl-field"><span class="fl-label">状态</span>${f.confirm?'<span>保存后已入账</span>':button((f.posted?'已入账':'未入账')+'<span>›</span>','pick-posted')}</div>${f.confirm?`<div class="fl-field"><label for= function transferRate(f){const from=acct(f.account).currency,to=acct(f.to).currency;return Number(f.amount)>0&&Number(f.received)>0?`1 ${from} = ${(Number(f.received)/Number(f.amount)).toLocaleString('en-US',{maximumFractionDigits:6})} ${to}`:'两端填写实际金额';}
function candidates(){const s=state.form?.desc.trim()||'';return [...history].filter(x=>!s||x[0].includes(s)).sort((a,b)=>Number(b[0].startsWith(s))-Number(a[0].startsWith(s))).slice(0,8);}

function detail(){const t=txs.find(x=>x.id===state.detail)||txs[3],a=acct(t.account),refunds=txs.filter(r=>r.original===t.id&&!r.deleted),original=t.original?txs.find(x=>x.id===t.original):null;return header(t.type==='transfer'?'转账详情':'交易详情','back',design.detailActions==='top'?button('编辑','edit'): '')+`<main class="fl-main"><div class="fl-detail-amount"><h2>${esc(t.desc)}</h2><strong class="fl-num">${t.type==='transfer'?'−'+amount(t.amount,a.currency):signed(t)} <span style="font-size:15px">${a.currency}</span></strong><span class="fl-tag">${t.posted?'已入账':'未入账'}</span></div>${t.deleted?'<div class="fl-notice">此记录已删除</div>':''}<div class="fl-detail-line"><span>账户</span><span>${esc(a.name)} ${a.archived?'· 已归档':''}</span></div>${t.type==='transfer'?`<div class="fl-detail-line"><span>转入</span><span>${esc(acct(t.to).name)} · ${amount(t.received,acct(t.to).currency)} ${acct(t.to).currency}</span></div>`:`<div class="fl-detail-line"><span>类目</span><span>${esc(catName(t.category))}</span></div>`}<div class="fl-detail-line"><span>交易时间</span><span>${t.time.slice(0,10)} ${t.time.slice(11,16)}</span></div>${t.project?`<div class="fl-detail-line"><span>旅游项目</span><span>${esc(t.project)}</span></div>`:''}${t.note?`<div class="fl-detail-line"><span>备注</span><span>${esc(t.note)}</span></div>`:''}${a.currency!=='CNY'?button('主币折算 <span>'+amount(cny(t.amount,a,t.time.slice(0,10)))+' CNY ›</span>','rate-source','class="fl-full"'):''}${refunds.length?`<div class="fl-section-title">关联退款 · ${refunds.length} 笔</div>${refunds.map(r=>button(esc(r.desc)+' <span>+'+amount(r.amount,acct(r.account).currency)+' ›</span>','detail',`data-id="${r.id}" class="fl-full"`)).join('')}<div class="fl-small" style="padding:5px 16px">剩余可退 ${amount(Math.max(0,t.amount-refunds.reduce((v,r)=>v+r.amount,0)),a.currency)} ${a.currency}</div>`:''}${original?button('原消费 <span>'+esc(original.desc)+(original.deleted?' · 已删除':'')+' ›</span>','detail',`data-id="${original.id}" class="fl-full"`):''}<hr class="fl-rule" function reportHome(){return header('报表','')+`<main class="fl-main">${button(ico('chart-no-axes-combined')+' 净值走势 <span>›</span>','open-report','class="fl-full" data-type="net"')}${button(ico('chart-bar')+' 支出分类 <span>›</span>','open-report','class="fl-full" data-type="expense"')}<div class="fl-section-title">常用报表</div>${bookmarked.map((b,i)=>button(esc(b.name)+'<span class="fl-small">'+({year:'本年',month:'本月','12m':'近12个月'}[b.range]||'自定义')+' ›</span>','bookmark',`data-index="${i}" class="fl-full"`)).join('')}</main>`+nav();}
function applyRange(range){state.range=range;state.end='2026-10-28';state.start=range==='month'?'2026-10-01':range==='year'?'2026-01-01':'2025-11-01';state.point=10000;}
function balanceAt(a,date){const now=Date.parse('2026-10-28T00:00:00Z'),begin=Date.parse('2025-11-01T00:00:00Z'),at=Date.parse(date+'T00:00:00Z');if(at>=now)return a.balance;const p=Math.max(0,Math.min(1,(at-begin)/(now-begin)));return Math.round(a.balance*(.71+.29*p)+(a.currency==='CNY'?Math.sin(p*Math.PI*4)*18000:0));}
function netSeries(){const selected=chosenAccounts(),start=new Date(state.start+'T00:00:00Z'),end=new Date(state.end+'T00:00:00Z');if(start>end)return [];const dateString=d=>d.toISOString().slice(0,10),before=new Date(+start-86400000),dates=[{date:state.start,balanceDate:dateString(before)}];if(state.granularity==='月'){let d=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0));while(d<=end){if(d>start)dates.push({date:dateString(d),balanceDate:dateString(d)});d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+2,0));}}else{const span=Math.ceil((end-start)/86400000),step=state.granularity==='周'?7:Math.max(1,Math.ceil(span/365));for(let at=+start+step*86400000;at<=+end;at+=step*86400000){const date=dateString(new Date(at));dates.push({date,balanceDate:date});}}if(dates.at(-1).date!==state.end)dates.push({date:state.end,balanceDate:state.end});return dates.map(d=>({...d,value:selected.reduce((total,a)=>total+cny(balanceAt(a,d.balanceDate),a,d.balanceDate),0)}));}
function expenses(){const ids=chosenAccounts().map(a=>a.id);return txs.filter(t=>!t.deleted&&t.posted&&['expense','refund'].includes(t.type)&&ids.includes(t.account)&&t.time.slice(0,10)>=state.start&&t.time.slice(0,10)<=state.end&&state.categoryIds.includes(t.category)&&(!state.projectFilter||t.project===state.projectFilter));}
function expenseTotals(){const rows=expenses(),out=rows.filter(t=>t.type==='expense').reduce((s,t)=>s+cny(t.amount,acct(t.account),t.time.slice(0,10)),0),refund=rows.filter(t=>t.type==='refund').reduce((s,t)=>s+cny(t.amount,acct(t.account),t.time.slice(0,10)),0);return {rows,out,refund,net:out-refund};}
function chart(series){if(!series.length)return '<div class="fl-empty">所选期间没有可用余额基准</div>';const W=Math.max(260,phone.clientWidth-28),H=180,L=57,R=10,T=12,B=27,values=series.map(p=>p.value/100),min=Math.floor(Math.min(...values)*.96/1000)*1000,max=Math.ceil(Math.max(...values)*1.04/1000)*1000||1000;const x=i=>L+(W-L-R)*(i/(Math.max(1,series.length-1))),y=v=>T+(H-T-B)*(1-(v-min)/(max-min||1));state.point=Math.min(state.point,series.length-1);const point=series[state.point];return `<div class="fl-chart"><svg role="img" aria-label="所选账户已入账净值走势，单位 CNY" viewBox="0 0 ${W} ${H}"><title>已入账净值走势，CNY</title>${[min,(min+max)/2,max].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--fl-line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" fill="var(--fl-secondary)" font-size="11">${Math.round(v).toLocaleString('en-US')}</text>`).join('')}<polyline points="${series.map((p,i)=>x(i)+','+y(p.value/100)).join(' ')}" fill="none" stroke="var(--fl-text)" stroke-width="2"/><circle cx="${x(state.point)}" cy="${y(point.value/100)}" r="4" fill="var(--fl-text)"/>${[0,Math.floor((series.length-1)/2),series.length-1].filter((v,i,arr)=>arr.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===series.length-1?'end':'middle'}" fill="var(--fl-secondary)" font-size="11">${series[i].date.slice(2,7).replace('-','/')}</text>`).join('')}</svg><input type="range" id="fl-point-range" aria-label="查看净值时点" min="0" max="${Math.max(0,series.length-1)}" value="${state.point}"></div><div class="fl-point fl-num">${point.date}　${amount(point.value)} CNY</div>`;}
function categoryBars(){const rows=expenses(),values=cats.map(c=>({...c,value:rows.filter(t=>t.category.startsWith(c.id+'.')).reduce((s,t)=>s+(t.type==='refund'?-1:1)*cny(t.amount,acct(t.account),t.time.slice(0,10)),0)})).filter(c=>c.children.some(x=>state.categoryIds.includes(c.id+'.'+x[0]))).sort((a,b)=>b.value-a.value),max=Math.max(1,...values.map(c=>Math.abs(c.value)));return values.map(c=>`<section class="fl-category">${button(ico(c.icon)+' '+esc(c.name)+' <span class="fl-num">'+amount(c.value)+' CNY '+(state.expanded[c.id]?'▴':'▾')+'</span>','expand-cat',`data-id="${c.id}"`)}<div class="fl-track"><span style="width:${Math.abs(c.value)/max*100}%"></span></div>${state.expanded[c.id]?c.children.filter(x=>state.categoryIds.includes(c.id+'.'+x[0])).map(([id,name])=>{const val=rows.filter(t=>t.category===c.id+'.'+id).reduce((s,t)=>s+(t.type==='refund'?-1:1)*cny(t.amount,acct(t.account),t.time.slice(0,10)),0);return `<div class="fl-category-child">${button(esc(name)+'<span class="fl-num">'+amount(val)+' ›</span>','category-drill',`data-cat="${c.id+'.'+id}"`)}</div>`;}).join(''):''}${button('<span class="fl-small">查看 '+esc(c.name)+' 明细</span><span>›</span>','category-drill',`data-cat="${c.id}"`)}</section>`).join('');}
function report(){const net=state.reportType==='net',selected=chosenAccounts(),totals=expenseTotals(),series=netSeries(),last=series.at(-1),first=series[0],rangeName={'12m':'近12个月',year:'本年',month:'本月',custom:'自定义'}[state.range];return header(net?'净值走势':'支出分类','back',button(ico('bookmark-plus'),'save-report','aria-label="保存常用报表"'))+`<main class="fl-main"><div class="fl-bar">${button(rangeName+' ▾','range')}${button('账户 '+selected.length+' ▾','report-accounts')}${net?button(state.granularity+' ▾','granularity'):button('类目 '+state.categoryIds.length+' ▾','report-categories')}</div><div class="fl-small" style="padding:0 16px">${state.start} — ${state.end}</div>${net?(selected.length?`<div class="fl-report-total"><span class="fl-small">${state.accountMode==='all'?'净值':'所选账户净值'} · CNY</span><strong class="fl-num">${last?amount(last.value):'—'}</strong></div><div class="fl-summary"><div>期初<strong>${first?amount(first.value):'—'}</strong></div><div>期末<strong>${last?amount(last.value):'—'}</strong></div><div>净变动<strong>${last&&first?amount(last.value-first.value):'—'}</strong></div></div>${chart(series)}${button('选中时点的账户明细 <span>›</span>','net-drill','class="fl-full"')}${button('<span class="fl-small">按转账折算 · 尾段暂定</span><span>›</span>','rate-source','class="fl-full"')}`:'<div class="fl-empty">未选择账户</div>'):(selected.length&&state.categoryIds.length?`<div class="fl-report-total"><span class="fl-small">净支出 · CNY</span><strong class="fl-num">${amount(totals.net)}</strong></div><div class="fl-summary"><div>总支出<strong>${amount(totals.out)}</strong></div><div>退款<strong>${amount(totals.refund)}</strong></div><div>净支出<strong>${amount(totals.net)}</strong></div></div>${!totals.rows.length?'<div class="fl-empty">本期没有已入账记录</div>':categoryBars()}${button('全部匹配明细 <span>'+totals.rows.length+' 笔 ›</span>','expense-drill','class="fl-full"')}`:`<div class="fl-empty">${!selected.length?'未选择账户':'未选择类目'}</div>`)}</main>`+nav();}
function netDrill(){const series=netSeries(),point=series[state.point]||series.at(-1),date=point?.balanceDate||state.end;return header('时点账户明细')+`<main class="fl-main"><div class="fl-section-title">${point?.date||state.end} · 已入账</div>${chosenAccounts().map(a=>{const balance=balanceAt(a,date);return `<div class="fl-row">${ico(a.icon)}${button(`<span class="fl-stack">${esc(a.name)}${a.archived?' · 已归档':''}<span class="fl-small fl-num">${amount(balance,a.currency)} ${a.currency}</span></span><span class="fl-num">${amount(cny(balance,a,date))} CNY ›</span>`,'account',`data-id="${a.id}" class="fl-grow fl-account"`)}</div>`;}).join('')}</main>`;}
function reportTransactions(){const rows=expenses().filter(t=>!state.drill||t.category===state.drill||t.category.startsWith(state.drill+'.'));return header(state.drill?esc(catName(state.drill)||cats.find(x=>x.id===state.drill)?.name||'分类明细'):'支出明细')+`<main class="fl-main"><div class="fl-section-title">${state.start} — ${state.end} · 仅已入账 · ${rows.length} 笔</div>${txRows(rows)}</main>`;}

case 'posted':return sheet('入账状态',button('已入账','choose-posted','data-value="true" class="fl-option"')+button('未入账','choose-posted','data-value="false" class="fl-option"'));
case 'delete':{const t=txs.find(x=>x.id===state.detail),refs=txs.filter(x=>x.original===t.id&&!x.deleted);return sheet('删除记录',`<div class="fl-notice">${refs.length?'有 '+refs.length+' 笔关联退款，可保留退款单独删除本笔。':'删除后将更新余额和报表。'}</div>`+button(refs.length?'仅删除本笔':'删除本笔','apply-delete','class="fl-option fl-danger" data-linked="false"')+(refs.length?button('一并删除关联退款','apply-delete','class="fl-option fl-danger" data-linked="true"'):''));}

case 'account-menu':{const a=acct(o.id);return sheet(a.name,button('编辑账户','edit-account',`data-id="${a.id}" class="fl-option"`)+button('上移','move-account',`data-id="${a.id}" data-step="-1" class="fl-option"`)+button('下移','move-account',`data-id="${a.id}" data-step="1" class="fl-option"`)+button('移到其他分组','move-group',`data-id="${a.id}" class="fl-option"`)+button(a.archived?'取消归档':'归档账户',a.archived?'unarchive':'archive-confirm',`data-id="${a.id}" class="fl-option"`));}

case 'archive':return sheet('归档账户',`<div class="fl-notice">保留余额和历史，可修正旧记录；新增前需取消归档。</div>${button('确认归档','apply-archive',`data-id="${o.id}" class="fl-option"`)}`);
case 'account-edit':{const a=o.id?acct(o.id):null;return sheet(a?'编辑账户':'新增账户',`<label class="fl-input">名称<input id="fl-account-name" value="${esc(a?.name||'')}"></label><label class="fl-input">类型<select id="fl-account-type"><option>银行</option><option>电子钱包</option><option>现金</option><option>信用卡</option></select></label><label class="fl-input">币种<select id="fl-account-currency" ${a?'disabled':''}>${['CNY','JPY','USD'].map(c=>`<option ${c===a?.currency?'selected':''}>${c}</option>`).join('')}</select></label><label class="fl-input">分组<select id="fl-account-group">${groups.map(g=>`<option ${g===a?.group?'selected':''}>${g}</option>`).join('')}</select></label>${!a?'<label class="fl-input">期初余额<input id="fl-account-balance" inputmode="decimal" value="0"></label>':''}<label class="fl-check"><input type="checkbox" id="fl-account-net" ${a?.net!==false?'checked':''}>计入净值</label>`,`<div class="fl-actions">${button('保存','apply-account',`data-id="${a?.id||''}" class="fl-primary"`)}</div>`);}
case 'ledger-menu':{const a=acct(state.account);return sheet(a.name,button('编辑账户','edit-account',`data-id="${a.id}" class="fl-option"`)+(!a.archived?button('调整余额','adjust','class="fl-option"')+button('归档账户','archive-confirm',`data-id="${a.id}" class="fl-option"`):button('取消归档','unarchive',`data-id="${a.id}" class="fl-option"`))+button('已归档账户','archived','class="fl-option"'));}
case 'adjust':return sheet('调整余额',`<label class="fl-input">核对后的实际余额<input id="fl-adjust-amount" inputmode="decimal" value="${acct(state.account).balance/(acct(state.account).currency==='JPY'?1:100)}"></label><label class="fl-input">原因<input id="fl-adjust-reason" placeholder="必填"></label>`,`<div class="fl-actions">${button('确认调整','apply-adjust','class="fl-primary"')}</div>`);
case 'range':return sheet('时间范围',`<div class="fl-grid">${[['month','本月'],['year','本年'],['12m','近12个月']].map(([v,l])=>button(l,'choose-range',`data-range="${v}"`)).join('')}</div><label class="fl-input">开始日期<input type="date" id="fl-range-start" value="${state.start}"></label><label class="fl-input">结束日期<input type="date" id="fl-range-end" value="${state.end}" max="2026-10-28"></label>`,`<div class="fl-actions">${button('应用自定义期间','custom-range','class="fl-primary"')}</div>`);
case 'granularity':return sheet('图表粒度',['日','周','月'].map(v=>button(v,'choose-granularity',`data-value="${v}" class="fl-option"`)).join(''));
case 'report-accounts':return sheet('选择账户',`<label class="fl-check fl-checkedgroup"><input type="checkbox" data-scope="all-accounts" ${state.accountMode==='all'?'checked':''}>${state.reportType==='net'?'全部计入净值的账户':'全部账户'}</label>${groups.map(g=>`<div class="fl-section-title">${g}</div>${accounts.filter(a=>a.group===g&&!a.archived).map(a=>`<label class="fl-check"><input type="checkbox" data-scope="account" data-id="${a.id}" ${chosenAccounts().some(x=>x.id===a.id)?'checked':''}>${esc(a.name)} <span class="fl-small">${a.currency}</span></label>`).join('')}`).join('')}<details><summary>已归档账户 · ${accounts.filter(a=>a.archived).length}</summary>${accounts.filter(a=>a.archived).map(a=>`<label class="fl-check"><input type="checkbox" data-scope="account" data-id="${a.id}" ${chosenAccounts().some(x=>x.id===a.id)?'checked':''}>${esc(a.name)}</label>`).join('')}</details>`,`<div class="fl-actions">${button('完成','close','class="fl-primary"')}</div>`);
case 'report-categories':return sheet('选择支出类目',`<label class="fl-check fl-checkedgroup"><input type="checkbox" data-scope="all-categories" ${state.categoryIds.length===cats.flatMap(c=>c.children).length?'checked':''}>全部支出类目</label>${cats.map(c=>`<label class="fl-check"><input type="checkbox" data-scope="cat-parent" data-id="${c.id}" ${c.children.every(x=>state.categoryIds.includes(c.id+'.'+x[0]))?'checked':''}>${ico(c.icon)} ${c.name}</label>${c.children.map(([id,name])=>`<label class="fl-check fl-child"><input type="checkbox" data-scope="category" data-id="${c.id+'.'+id}" ${state.categoryIds.includes(c.id+'.'+id)?'checked':''}>${name}</label>`).join('')}`).join('')}`,`<div class="fl-actions">${button('完成','close','class="fl-primary"')}</div>`);
case 'save-report':return sheet('保存常用报表',`<label class="fl-input">名称<input id="fl-report-name" value="${esc(state.reportName||(state.reportType==='net'?'我的净值走势':'我的支出分类'))}"></label><div class="fl-small" style="padding:8px">${state.range==='custom'?'固定期间':'相对期间'} · ${state.start} — ${state.end} · 仅已入账</div>`,`<div class="fl-actions">${button('保存','apply-report','class="fl-primary"')}</div>`);
case 'rate-source':return sheet('转账区间折算',`<div class="fl-detail-line"><span>主币</span><span>CNY</span></div><div class="fl-detail-line"><span>A · 09月15日</span><span>960 CNY → 20,000 JPY</span></div><div class="fl-detail-line"><span>B · 10月15日</span><span>490 CNY → 10,000 JPY</span></div><div class="fl-detail-line"><span>美元账户</span><span>1,420 CNY → 200 USD</span></div><div class="fl-notice">A 之前按 A；A–B 之间按 B。B 之后先按 B 暂定，下次转入后更新这一段。</div><div class="fl-notice">净值 = 已入账原币余额 × 对应区间汇率。未入账不进入余额与正式报表。</div>`);
case 'currency-info':return sheet('账本与币种',`<div class="fl-detail-line"><span>主币种</span><span>CNY · 人民币</span></div><div class="fl-notice">已有金额记录，主币种已锁定。</div>`);
case 'category-settings':return sheet('收支类目',cats.map(c=>`<details><summary>${ico(c.icon)} ${c.name}</summary>${c.children.map(x=>`<div class="fl-detail-line"><span>${x[1]}</span>${ico(c.icon)}</div>`).join('')}</details>`).join(''));
case 'edit-impact':return sheet('关联影响',`<div class="fl-notice">修改金额将影响关联退款，需要重新核对。</div>${button('确认修改','save-impact','class="fl-option"')}`);
}return '';}
function render(){phone.style.setProperty('--fl-pad',design.density==='compact'?'5px':'10px');const views={accounts:home,ledger:()=>ledger(false),all:()=>ledger(true),archived,form:formView,detail,reports:reportHome,report,'net-drill':netDrill,'report-transactions':reportTransactions,settings};phone.innerHTML=(views[state.screen]||home)()+overlay()+(state.notice?`<div class="fl-toast" role="status">${esc(state.notice)}</div>`:'');root.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.jump===state.screen||(b.dataset.jump==='reports'&&['report','net-drill','report-transactions'].includes(state.screen)))));phone.querySelectorAll('[data-scope="cat-parent"]').forEach(el=>{const c=cats.find(c=>c.id===el.dataset.id),n=c.children.filter(x=>state.categoryIds.includes(c.id+'.'+x[0])).length;el.indeterminate=n>0&&n<c.children.length;});refreshIcons();}
let noticeTimer;function notify(text){state.notice=text;render();clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{state.notice='';phone.querySelector('.fl-toast')?.remove();},1800);}
function applyBalance(t,direction){if(!t.posted||t.deleted)return;const a=acct(t.account);if(t.type==='transfer'){a.balance-=direction*t.amount;acct(t.to).balance+=direction*t.received;}else a.balance+=direction*(t.type==='expense'?-t.amount:t.amount);}
function commitForm(again=false,approved=false){const f=state.form,a=acct(f.account),scale=a.currency==='JPY'?1:100,num=Number(f.amount);state.error='';if(!Number.isFinite(num)||num<=0)state.error='请填写大于零的金额';else if(!f.desc.trim())state.error='请填写描述';else if(f.kind!=='transfer'&&!f.category)state.error='请选择类目';else if(f.kind==='transfer'&&(f.to===f.account||Number(f.received)<=0||!Number.isFinite(Number(f.received))))state.error='请选择不同的转入账户并填写到账金额';else if(!f.id&&a.archived)state.error='账户已归档，取消归档后才能新增';if(!state.error&&f.kind==='refund'&&!f.id){const src=txs.find(t=>t.id===f.original),available=src.amount-txs.filter(t=>t.original===src.id&&!t.deleted).reduce((v,t)=>v+t.amount,0);if(Math.round(num*scale)>available)state.error='退款金额超过当前可退额';}if(state.error){const e=phone.querySelector('#fl-error');if(e)e.textContent=state.error;return;}const old=f.id?txs.find(t=>t.id===f.id):null;if(old&&old.amount!==Math.round(num*scale)&&txs.some(t=>t.original===old.id&&!t.deleted)&&!approved){state.overlay={kind:'edit-impact'};render();return;}const t={id:old?.id||'demo-'+(txs.length+1),account:f.account,to:f.kind==='transfer'?f.to:undefined,type:f.kind,amount:Math.round(num*scale),received:f.kind==='transfer'?Math.round(Number(f.received)*(acct(f.to).currency==='JPY'?1:100)):undefined,desc:f.desc.trim(),category:f.category,time:f.time,posted:f.confirm?true:f.posted,postingDate:f.postingDate,project:f.project,note:f.note,original:f.original||undefined};if(old){applyBalance(old,-1);Object.assign(old,t);applyBalance(old,1);}else{txs.push(t);applyBalance(t,1);}if(!history.some(x=>x[0]===t.desc)&&t.category)history.unshift([t.desc,t.category]);state.overlay=null;if(again){Object.assign(f,{id:null,amount:'',desc:'',category:'',manualCat:false,project:'',note:'',extra:false});state.formInitial=JSON.stringify(f);state.keyboard='amount';notify('已保存，继续记一笔');}else{pop();notify('已保存');}persist();}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.jump){clearTimeout(noticeTimer);state.notice='';const screen=b.dataset.jump;Object.assign(state,{stack:[],overlay:null,keyboard:null,manage:false,pendingOnly:false,search:'',ledgerAsOf:null});if(screen==='form'){state.screen='ledger';state.account='wallet';makeForm();}else if(screen==='detail'){state.screen='ledger';state.account='credit';go('detail',{detail:'coat'});}else{state.screen=screen;render();}persist();return;}const action=b.dataset.action;if(!action)return;if(action==='root'){clearTimeout(noticeTimer);state.notice='';}const id=b.dataset.id;switch(action){
case 'back':back();break;
case 'root':Object.assign(state,{screen:b.dataset.target,stack:[],overlay:null,keyboard:null,manage:false,pendingOnly:false,search:'',ledgerAsOf:null});render();break;
case 'manage':state.manage=!state.manage;render();break;
case 'manage-settings':go('accounts',{manage:true});break;

case 'new':state.account=id||state.account;makeForm();break;
case 'detail':go('detail',{detail:id});break;
case 'edit':makeForm(state.detail);break;
case 'refund':makeForm(null,'refund',state.detail);break;
case 'confirm-posted':makeForm(state.detail,'confirm');break;
case 'delete':state.overlay={kind:'delete'};render();break;
case 'apply-delete':{const t=txs.find(x=>x.id===state.detail),targets=[t,...(b.dataset.linked==='true'?txs.filter(x=>x.original===t.id&&!x.deleted):[])];targets.forEach(x=>{applyBalance(x,-1);x.deleted=true;});pop();notify('已删除');break;}
case 'close':state.overlay=null;render();break;
case 'discard':state.form=null;pop();break;
case 'form-kind':{const f=state.form;f.kind=b.dataset.kind;f.category='';f.manualCat=false;f.desc=f.kind==='transfer'?'转账':'';state.keyboard='amount';render();break;}
case 'pick-account':state.overlay={kind:'accounts',slot:b.dataset.slot};render();break;
case 'choose-account':state.form[b.dataset.slot]=id;state.overlay=null;render();break;
case 'pick-category':state.overlay={kind:'categories',parent:String(state.form.category).split('.')[0]};render();break;

case 'candidate':{const f=state.form;f.desc=b.dataset.name;if(!f.manualCat)f.category=b.dataset.cat;render();const d=phone.querySelector('#fl-desc');d?.focus();d?.setSelectionRange(f.desc.length,f.desc.length);break;}
case 'extra':state.form.extra=!state.form.extra;render();break;
case 'pick-time':state.overlay={kind:'time'};render();break;
case 'apply-time':{const f=state.form,date=phone.querySelector('#fl-time-date').value,parts=['hour','minute','second'].map(k=>Number(phone.querySelector('#fl-time-'+k).value));if(!date||parts.some((v,i)=>!Number.isInteger(v)||v<0||v>(i===0?23:59)))return;const sec=String(parts[2]).padStart(2,'0'),fraction=sec===f.time.slice(17,19)?f.time.slice(19):'';f.time=date+'T'+parts.map(v=>String(v).padStart(2,'0')).join(':')+fraction;state.overlay=null;render();break;}
case 'pick-posted':state.overlay={kind:'posted'};render();break;
case 'choose-posted':state.form.posted=b.dataset.value==='true';state.overlay=null;render();break;
case 'save':commitForm(false);break;
case 'save-more':commitForm(true);break;

case 'open-report':state.reportType=b.dataset.type;state.selectedSaved=null;state.projectFilter='';applyRange(state.reportType==='net'?'12m':'month');go('report');break;

root.addEventListener('focusin',event=>{if(state.screen!=='form')return;const k={'fl-desc':'desc','fl-amount':'amount','fl-received':'received'}[event.target.id];if(k){state.keyboard=k;drawKeyboard();event.target.scrollIntoView({block:'nearest'});}});
root.addEventListener('input',event=>{const el=event.target;if(state.screen==='form'){const field={'fl-amount':'amount','fl-received':'received','fl-desc':'desc','fl-note':'note','fl-project':'project','fl-posting-date':'postingDate'}[el.id];if(field){state.form[field]=el.value;if(field==='desc')drawKeyboard();const r=phone.querySelector('#fl-rate');if(r)r.textContent=transferRate(state.form);}}if(el.id==='fl-point-range'){state.point=Number(el.value);const main=phone.querySelector('.fl-main'),scroll=main?.scrollTop||0;render();phone.querySelector('.fl-main').scrollTop=scroll;}if(el.id==='fl-search'){state.search=el.value;const cursor=el.selectionStart;render();const s=phone.querySelector('#fl-search');s.focus();s.setSelectionRange(cursor,cursor);}});
root.addEventListener('change',event=>{const el=event.target;if(!el.dataset.scope)return;const scope=el.dataset.scope;if(scope==='all-accounts'){state.accountMode=el.checked?'all':'custom';state.accountIds=[];}if(scope==='account'){state.accountIds=chosenAccounts().map(a=>a.id);state.accountMode='custom';state.accountIds=el.checked?[...new Set([...state.accountIds,el.dataset.id])]:state.accountIds.filter(id=>id!==el.dataset.id);}if(scope==='all-categories')state.categoryIds=el.checked?cats.flatMap(c=>c.children.map(x=>c.id+'.'+x[0])):[];if(scope==='category')state.categoryIds=el.checked?[...new Set([...state.categoryIds,el.dataset.id])]:state.categoryIds.filter(id=>id!==el.dataset.id);if(scope==='cat-parent'){const c=cats.find(c=>c.id===el.dataset.id),ids=c.children.map(x=>c.id+'.'+x[0]);state.categoryIds=el.checked?[...new Set([...state.categoryIds,...ids])]:state.categoryIds.filter(id=>!ids.includes(id));}state.point=10000;render();persist();});
let chartDrag=false;function setChartPoint(e){const svg=phone.querySelector('.fl-chart svg');if(!svg)return;const bounds=svg.getBoundingClientRect(),W=svg.viewBox.baseVal.width,x=(e.clientX-bounds.left)/bounds.width*W,series=netSeries();state.point=Math.max(0,Math.min(series.length-1,Math.round((x-57)/(W-67)*(series.length-1))));const main=phone.querySelector('.fl-main'),scroll=main?.scrollTop||0;render();phone.querySelector('.fl-main').scrollTop=scroll;}phone.addEventListener('pointermove',e=>{if(chartDrag&&e.buttons)setChartPoint(e);});let swipe=null;phone.addEventListener('pointerdown',e=>{if(e.target.closest('.fl-chart svg')){chartDrag=true;setChartPoint(e);return;}const bounds=phone.getBoundingClientRect();if(e.clientX-bounds.left<=22)swipe={x:e.clientX,y:e.clientY};});phone.addEventListener('pointerup',e=>{chartDrag=false;if(swipe&&e.clientX-swipe.x>75&&Math.abs(e.clientY-swipe.y)<55&&state.stack.length)back();swipe=null;});phone.addEventListener('pointercancel',()=>{swipe=null;chartDrag=false;});
render();
